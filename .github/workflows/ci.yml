name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: 'Commit-uj screenshotove sa emulatora u docs/screenshots (za README)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + unit testovi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build i unit testovi (core + Robolectric)
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Rezime testova
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, re
          total = failed = 0
          for p in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              s = open(p, encoding='utf-8').read()
              m = re.search(r'tests="(\d+)" skipped="\d+" failures="(\d+)" errors="(\d+)"', s)
              if m:
                  total += int(m[1]); failed += int(m[2]) + int(m[3])
              for f in re.findall(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="([^"]*)"', s):
                  print(f"FAILED {f[1]}.{f[0]}: {f[2][:300]}")
          print(f"### Unit testovi: {total} ukupno, {failed} palo")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-and-reports
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/**
            core/build/reports/tests/**
          if-no-files-found: ignore

  emulator:
    name: Emulator testovi (UI, Doze, restart)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Uključi KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK-ova za emulator
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Release APK potpisan debug ključem (samo za smoke test)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --out release-smoke.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Emulator (API 36) + testovi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Belgrade
          script: ./ci/emulator-tests.sh

      - name: Rezultati
        if: always()
        run: cat ci-out/results.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: ci-out/
          if-no-files-found: ignore

      - name: Commit screenshotova u docs/screenshots
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.commit_screenshots == 'true'
        run: |
          mkdir -p docs/screenshots
          for f in ci-out/screenshots/*.png; do
            convert "$f" -resize 540x "docs/screenshots/$(basename "$f")" 2>/dev/null || cp "$f" docs/screenshots/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Screenshotovi sa emulatora [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
