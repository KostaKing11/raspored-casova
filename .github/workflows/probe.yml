name: probe
on:
  push:
    branches: [ccr-36e7a098-rfcqxp]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools $ANDROID_HOME/cmdline-tools || true
          ls -la /dev/kvm || true
          java -version 2>&1; gradle --version | head -5 || true
          m() { echo "== $1"; curl -s "https://dl.google.com/dl/android/maven2/$1/maven-metadata.xml" | grep -oP '(?<=<version>)[^<]+' | grep -v -E 'alpha|beta|rc|dev|RC|Beta|Alpha' | tail -6 | tr '\n' ' '; echo; }
          c() { echo "== $1"; curl -s "https://repo1.maven.org/maven2/$1/maven-metadata.xml" | grep -oP '(?<=<version>)[^<]+' | grep -v -E 'alpha|beta|rc|dev|RC|Beta|Alpha|M[0-9]' | tail -8 | tr '\n' ' '; echo; }
          m com/android/tools/build/gradle
          m androidx/compose/compose-bom
          m androidx/room/room-runtime
          m androidx/activity/activity-compose
          m androidx/navigation/navigation-compose
          m androidx/lifecycle/lifecycle-runtime-compose
          m androidx/core/core-ktx
          m androidx/test/ext/junit
          m androidx/test/runner
          m androidx/test/core
          m androidx/test/espresso/espresso-core
          m androidx/compose/material/material-icons-extended
          m androidx/datastore/datastore-preferences
          m com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin
          m androidx/test/uiautomator/uiautomator
          c com/google/devtools/ksp/symbol-processing-gradle-plugin
          c org/jetbrains/kotlin/kotlin-gradle-plugin
          c org/jetbrains/kotlinx/kotlinx-serialization-json
          c org/jetbrains/kotlinx/kotlinx-coroutines-android
          c org/robolectric/robolectric
          c junit/junit
          curl -s https://services.gradle.org/versions/current | head -5
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list 2>/dev/null | grep -E "platforms;android-|system-images;android-3[4-9];(google_apis|default);x86_64|build-tools;3[5-9]" | head -40
