name: Release

# Builds a signed release APK and attaches it to a GitHub Release.
#   git tag v1.0.1 && git push origin v1.0.1
# or: Actions → Release → Run workflow → tag "v1.0.1" (the tag is created on the selected branch)
# Signing key comes from repository secrets (see README → "Potpisivanje"), so every
# version is signed with the same key and installs over the previous one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag nove verzije (npr. v1.0.1) – biće napravljen na izabranoj grani'
        required: true
      dry_run:
        description: 'Probni build sa privremenim ključem (ništa se ne objavljuje)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Tag push: builds the tagged commit. Manual run: builds the selected branch and the
      # release step creates the tag on that commit.
      - uses: actions/checkout@v4

      - name: Provera ključa za potpisivanje
        id: check
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$KS" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -q '\.apk$'; then
            echo "::notice::Release $TAG već ima potpisan APK, a secrets nisu podešeni – preskačem build."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::error::Nedostaju GitHub Secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD (README → Potpisivanje)."
          exit 1

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.skip == 'false'

      - name: Keystore iz secrets
        if: steps.check.outputs.skip == 'false' && github.event.inputs.dry_run != 'true'
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Privremeni ključ (samo probni build)
        if: github.event.inputs.dry_run == 'true'
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -alias dry -keyalg RSA -keysize 2048 \
            -validity 1 -storepass dryrun123 -keypass dryrun123 -dname "CN=dry run" >/dev/null 2>&1
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.p12"
            echo "DRY_STORE_PASSWORD=dryrun123"
          } >> "$GITHUB_ENV"

      - name: Build potpisanog APK-a
        if: steps.check.outputs.skip == 'false'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "${DRY_STORE_PASSWORD:-}" ]; then
            export RELEASE_STORE_PASSWORD="$DRY_STORE_PASSWORD" RELEASE_KEY_PASSWORD="$DRY_STORE_PASSWORD" RELEASE_KEY_ALIAS=dry
          fi
          V="${TAG#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V="0.0.1"
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( ${MA:-1} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          ./gradlew --stacktrace :core:test :app:assembleRelease -PappVersionName="$V" -PappVersionCode="$CODE"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "raspored-casova-$TAG.apk"
          rm -f "$RUNNER_TEMP/release.p12"

      - name: GitHub Release
        if: steps.check.outputs.skip == 'false' && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Raspored časova ${{ env.TAG }}
          files: raspored-casova-${{ env.TAG }}.apk
          generate_release_notes: true
